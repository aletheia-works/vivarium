<template data-slot="h1">motionEye #3515 — "Remember me" comes back to the login</template>

<template data-slot="lede">
  The pull request brings back a "Remember me" switch on the login
  dialog, off by default. Off, the session cookie has no expiry and
  goes when the browser closes; on, it lasts a day. The server-side
  session lifetime is unchanged.
</template>

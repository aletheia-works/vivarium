<template data-slot="title">motionEye #3515 — "Remember me" comes back to the login</template>

<template data-slot="h1">motionEye #3515 — "Remember me" comes back to the login</template>

<template data-slot="lede">
  The pull request brings back a "Remember me" switch on the login
  dialog, on by default. On, the session cookie lasts a day, as in
  0.44.0; off, it has no expiry and goes when the browser closes. The
  server-side session lifetime is unchanged.
</template>

<template data-slot="check">
  <ol>
    <li data-i18n="check.step1">Open the preview link. The login dialog shows a <strong>Remember me</strong>
      switch, on, below <strong>Username</strong> and <strong>Password</strong>.</li>
    <li data-i18n="check.step2">Hover over the <strong>Remember me</strong> row: a <strong>?</strong> appears at
      its end. Hover over the <strong>?</strong>: its tooltip says the switch keeps you

    <li data-i18n="check.step3">In a normal window, sign in as <code>admin</code> with the password

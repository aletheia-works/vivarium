<template data-slot="title">motionEye #3513 — the 0.45.0b1 beta</template>

<template data-slot="h1">motionEye #3513 — the 0.45.0b1 beta</template>

<template data-slot="lede">
  The pull request releases the current development branch as the
  0.45.0b1 beta. Its main breaking change is that motionEye now
  verifies every certificate, with a switch to turn verification off
  for each remote camera, upload service, webhook and e-mail. The
  preview has mail, upload targets with a self-signed certificate,
  and recorded media to try these on.
</template>

<template data-slot="check">
  <ol>
    <li data-i18n="check.step1">Sign in as <code>admin</code> with the password <code>password</code>.</li>
    <li data-i18n="check.step2">In a camera's <strong>Motion Notifications</strong>, turn on
      <strong>Send An Email</strong> with the SMTP server <code>127.0.0.1</code>,
      port <code>1025</code>, <strong>Use TLS</strong> on and any account. With
      <strong>Verify certificate</strong> on, <strong>Test Email</strong> fails
      on the self-signed certificate; turn it off, and the test e-mail
      arrives at <code>/mailpit/</code> of the preview link.</li>
    <li data-i18n="check.step3">In <strong>File storage</strong>, turn on <strong>Upload Media Files</strong>
      with the FTP service at <code>127.0.0.1</code>, port <code>21</code>,
      user <code>preview</code> and password <code>password</code>. Turn on the
      new <strong>Use TLS (FTPS)</strong> and turn off
      <strong>Verify certificate</strong>. Uploaded files show up at
      <code>/uploads/</code> of the preview link.</li>
    <li data-i18n="check.step4">Use the new buttons on a camera to start and end a motion event and to
      toggle motion detection.</li>
    <li data-i18n="check.step5">Open a camera's pictures and movies, play a movie, close it and play it
      again. Every camera has two days of recordings.</li>
    <li data-i18n="check.step6">Change the layout and the camera order. They are now kept per browser,
      and the number of columns follows the window width by default.</li>
  </ol>
</template>

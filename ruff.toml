target-version = "py315"

line-length = 100

include = ["src/layer1_wasm/*/*.py", "docs/scripts/**/*.py", "infra/aws/motioneye/*.py"]
extend-exclude = [
  "**/node_modules/**",
  "**/dist/**",
  "**/target/**",
  "**/doc_build/**",
  "**/.venv/**",
]

[per-file-target-version]
# The preview image runs Debian trixie's python3.
"infra/aws/motioneye/*.py" = "py313"

[lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
]

[format]
quote-style = "double"

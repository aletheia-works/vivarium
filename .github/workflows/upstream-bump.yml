name: upstream-bump

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  recipes:
    name: list recipes with an upstream pin
    if: github.repository_owner == 'aletheia-works' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq

      - name: List them
        id: list
        run: |
          set -euo pipefail
          echo "slugs=$(mise run repro:upstream:list | jq -Rnc '[inputs | select(length > 0)]')" >> "${GITHUB_OUTPUT}"

  bump:
    name: bump ${{ matrix.slug }}
    needs: recipes
    if: needs.recipes.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.recipes.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
      BRANCH: chore/bump-upstream-${{ matrix.slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TF_TOKEN_GITHUB }}
          persist-credentials: true

      - name: Setup mise (bun, jq)
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          install: true
          cache: true
          experimental: true
          install_args: bun jq

      - name: Move the pin to the latest release
        id: bump
        run: |
          set -euo pipefail
          mise run repro:upstream:bump "${SLUG}" > "${RUNNER_TEMP}/bump.md"
          if git diff --quiet; then
            echo "${SLUG} is already on the latest upstream release."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            cat "${RUNNER_TEMP}/bump.md" >> "${GITHUB_STEP_SUMMARY}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TF_TOKEN_GITHUB }}
        run: |
          set -euo pipefail
          version="$(jq -r '.upstream.version' "src/layer1_wasm/${SLUG}/recipe.json")"
          title="chore(wasm): bump the ${SLUG} baseline to ${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --quiet -C "${BRANCH}"
          git commit --quiet -am "${title}"
          pushed=false
          if git fetch --quiet origin "${BRANCH}" 2>/dev/null &&
            [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            pushed=true
          fi
          if [ "${pushed}" = true ] &&
            [ "$(gh pr list --head "${BRANCH}" --state all --json number --jq length)" != 0 ]; then
            echo "${BRANCH} already carries this change and has a pull request; leaving both as they are."
            exit 0
          fi
          {
            cat "${RUNNER_TEMP}/bump.md"
            echo
            echo "This pull request's own repro-regression run re-checks the recipe on the new release."
            echo
            echo "- If the verdict flips to unreproduced, the bug is fixed upstream: retire the recipe or point it at the last release that still reproduces, rather than reverting this pin."
            echo "- If the build fails instead, something the recipe applies to the upstream source (a patch, a build step) no longer fits the new release. Fix the recipe on this branch."
            echo "- The fix-candidate pane is not rebuilt here, so until it is, the two panes may run different upstream bases."
          } > "${RUNNER_TEMP}/body.md"
          if [ "${pushed}" = false ]; then
            git push --quiet --force origin "HEAD:${BRANCH}"
          fi
          if [ "$(gh pr view "${BRANCH}" --json state --jq .state 2>/dev/null || true)" = "OPEN" ]; then
            gh pr edit "${BRANCH}" --title "${title}" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh pr create --base main --head "${BRANCH}" --title "${title}" --body-file "${RUNNER_TEMP}/body.md"
          fi

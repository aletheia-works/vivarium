name: Test previews

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test the preview proxy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (node)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install: true
          cache: true
          experimental: true
          install_args: node

      - run: mise run ci:previews

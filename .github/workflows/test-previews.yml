name: Test previews

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test the preview proxy and image scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise (node, uv)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: true
          experimental: true
          install_args: node uv

      - run: mise run ci:previews

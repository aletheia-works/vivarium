name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-apply.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  apply:
    if: github.repository_owner == 'aletheia-works'
    uses: aletheia-works/.github/.github/workflows/terraform-apply.yml@7909fa16779b51ed8ddd86d5077f11b7ce7901bd # v1.5.1
    with:
      working_directory: infra/github
      # No GitHub Environment gates this apply.
      environment: ''
      tfvar_assignments: |
        create_phase_milestones=true
    secrets: inherit

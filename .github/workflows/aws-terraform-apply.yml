name: AWS Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - 'infra/aws/**'
      - 'src/layer3_previews/**'
      - '.github/workflows/aws-terraform-apply.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: terraform-state-aws
  cancel-in-progress: false

jobs:
  apply:
    name: OpenTofu Apply (infra/aws)
    if: github.repository == 'aletheia-works/vivarium'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws-apply
    defaults:
      run:
        working-directory: infra/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TOFU_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup mise (opentofu)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install: true
          cache: true
          experimental: true
          install_args: opentofu

      - name: Configure state encryption
        env:
          TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ ! "${TF_STATE_PASSPHRASE}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::TF_STATE_PASSPHRASE must be 64 lowercase hex characters (openssl rand -hex 32)."
            exit 1
          fi
          {
            echo 'TF_ENCRYPTION<<TF_ENCRYPTION_EOF'
            cat <<EOF
          key_provider "pbkdf2" "state" {
            passphrase = "${TF_STATE_PASSPHRASE}"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          state {
            method = method.aes_gcm.state
          }
          EOF
            echo 'TF_ENCRYPTION_EOF'
          } >> "$GITHUB_ENV"

      - name: Download state artifact
        if: vars.LATEST_AWS_APPLY_RUN_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-state-aws
          path: infra/aws/
          run-id: ${{ vars.LATEST_AWS_APPLY_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - run: tofu init -input=false -lockfile=readonly
      - run: tofu apply -input=false -auto-approve -no-color

      - name: Upload state artifact
        id: upload
        if: always() && hashFiles('infra/aws/terraform.tfstate') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-state-aws
          path: infra/aws/terraform.tfstate
          retention-days: 90
          overwrite: true
          if-no-files-found: error

      # GITHUB_TOKEN cannot write repository variables.
      - name: Point LATEST_AWS_APPLY_RUN_ID at this run
        if: always() && steps.upload.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.TF_TOKEN_GITHUB }}
          script: |
            const name = 'LATEST_AWS_APPLY_RUN_ID';
            const value = String(context.runId);
            try {
              await github.rest.actions.updateRepoVariable({ owner: context.repo.owner, repo: context.repo.repo, name, value });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.actions.createRepoVariable({ owner: context.repo.owner, repo: context.repo.repo, name, value });
            }

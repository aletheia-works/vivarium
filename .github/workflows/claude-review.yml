name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: aletheia-works/.github/.github/workflows/claude-review.yml@2d85c4ddca01b35127a16915f0000bc54fdc85a6 # v1.4.0
    with:
      rules: >-
        AGENTS.md, the README.md nearest the changed code, and any spec page under docs/site/*/spec/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

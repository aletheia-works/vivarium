name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: aletheia-works/.github/.github/workflows/claude-review.yml@0ab4b956b12760b3926ac8f768e04432404a5182 # v1.3.4
    with:
      rules: >-
        AGENTS.md, the README.md nearest the changed code, and any spec page under docs/site/*/spec/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

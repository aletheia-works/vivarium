name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    uses: aletheia-works/.github/.github/workflows/claude-review.yml@7909fa16779b51ed8ddd86d5077f11b7ce7901bd # v1.5.1
    with:
      rules: >-
        AGENTS.md, the README.md nearest the changed code, and any spec page under docs/site/*/spec/
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

name: Check Conventional Commit

on:
  # edited: a retitled PR is checked again, as its title becomes the
  # squash-merge commit's header.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    uses: aletheia-works/.github/.github/workflows/commitlint.yml@7909fa16779b51ed8ddd86d5077f11b7ce7901bd # v1.5.1

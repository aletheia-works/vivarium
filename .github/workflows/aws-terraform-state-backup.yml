name: AWS Terraform State Backup

on:
  schedule:
    - cron: '45 3 * * 1'

  workflow_run:
    workflows: ['AWS Terraform Apply']
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  backup:
    if: |
      github.repository == 'aletheia-works/vivarium' &&
      vars.LATEST_AWS_APPLY_RUN_ID != '' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.conclusion == 'success')
    uses: aletheia-works/.github/.github/workflows/terraform-state-backup.yml@f1e71b990c2fd7086e78931ba8609b96ac68104b # v1.4.1
    with:
      state_artifact_name: terraform-state-aws
      state_run_id_variable: LATEST_AWS_APPLY_RUN_ID
      module_label: aws
      working_directory: infra/aws
    secrets:
      TF_TOKEN_GITHUB: ${{ secrets.TF_TOKEN_GITHUB }}

name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    uses: aletheia-works/.github/.github/workflows/dependabot-auto-merge.yml@7909fa16779b51ed8ddd86d5077f11b7ce7901bd # v1.5.1
    # The bot sets up the merge so that it starts main's push workflows.
    # Only a Dependabot secret reaches a run that Dependabot starts.
    secrets:
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
